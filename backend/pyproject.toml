[project]
name = "hootpr-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "openai>=1.55",
  "cryptography>=43",
  "structlog>=24.4",
  "pyyaml>=6.0.2",
  "uuid-utils>=0.9",
  "docker>=7.1",
  "langgraph>=0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "testcontainers[postgres,redis]>=4.8",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
  "types-docker>=7.2.0.20260923",
  "tree-sitter-language-pack>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S105", "S106", "S107"]
"migrations/**" = ["E501"]
"tests/fixtures/**" = ["ALL"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "testcontainers.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs Postgres/Redis containers",
  "sandbox: needs Docker and the hootpr/sandbox image (make test-sandbox)",
]
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]
